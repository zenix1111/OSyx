[package]
name = "osyx-update"
description = "OSyx system updates: the signed release manifest (Ed25519), version order and the paths an update may replace"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = { version = "3", default-features = false }

[dev-dependencies]
# The release tool (examples/release.rs) runs on the build host.
getrandom = "0.2"
sha2 = "0.10"
