name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

jobs:
  codspeed:
    name: Run benchmarks
    # Only the canonical repository owns the CodSpeed project, and pull
    # requests from forks get no OIDC token there, so their uploads fail with
    # 401 and the analysis run has no data. Skip both instead of failing.
    if: >-
      github.repository == 'OSyxSoftware/OSyx' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          cache-target: release
          bins: cargo-codspeed

      # Only the host-testable default members are built; the loader, kernel
      # and user programs are freestanding.
      - name: Build the benchmark targets
        run: cargo codspeed build -m simulation

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
