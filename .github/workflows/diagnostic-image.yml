name: Build diagnostic image

on:
  push:
    branches: [codex/re-dma-image]

permissions:
  contents: read

jobs:
  image:
    if: github.repository == 'zenix1111/OSyx'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils clang cpio e2fsprogs lld mingw-w64 python3 zstd
      - name: Install Rust targets
        run: rustup show
      - name: Build live image
        run: bash scripts/build-linux.sh build/diagnostic
      - name: Upload diagnostic USB image
        uses: actions/upload-artifact@v4
        with:
          name: osyx-re-dma-diagnostic-usb
          path: build/diagnostic/osyx-live-usb.img
          if-no-files-found: error
          retention-days: 7
