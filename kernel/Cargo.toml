[package]
name = "osyx-kernel"
description = "The OSyx kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "osyx-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
osyx-abi = { path = "../shared/abi" }
osyx-bootinfo = { path = "../shared/bootinfo" }
osyx-crypto = { path = "../shared/crypto" }
osyx-elf = { path = "../boot/elf" }
osyx-ext4 = { path = "../storage/ext4" }
osyx-fat = { path = "../storage/fat" }
osyx-exfat = { path = "../storage/exfat" }
osyx-gfx = { path = "../boot/gfx" }
osyx-input = { path = "../shared/input" }
osyx-mm = { path = "mm" }
osyx-net = { path = "../network/net" }
osyx-usb = { path = "../drivers/usb" }
osyx-wireless = { path = "../drivers/wireless", default-features = false }
osyx-part = { path = "../storage/part" }
osyx-tmpfs = { path = "../storage/tmpfs" }
osyx-vfs = { path = "../storage/vfs" }
# The live root (a boot module) is zlib-compressed; no_std with alloc only.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# Zstandard decoder (pure Rust, MIT) for the live root (OSYXLR2).
ruzstd = { version = "0.9.1", default-features = false }
