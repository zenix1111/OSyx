[package]
name = "osyx-nettools"
description = "OSyx network commands: ping, net, netstat, dns, nc and timesync"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ping"
path = "src/bin/ping.rs"
test = false
bench = false

[[bin]]
name = "net"
path = "src/bin/net.rs"
test = false
bench = false

[[bin]]
name = "netstat"
path = "src/bin/netstat.rs"
test = false
bench = false

[[bin]]
name = "dns"
path = "src/bin/dns.rs"
test = false
bench = false

[[bin]]
name = "nc"
path = "src/bin/nc.rs"
test = false
bench = false

[[bin]]
name = "timesync"
path = "src/bin/timesync.rs"
test = false
bench = false

[[bin]]
name = "wifi-watch"
path = "src/bin/wifi-watch.rs"
test = false
bench = false

[dependencies]
os-std = { path = "../../runtime/os-std" }
