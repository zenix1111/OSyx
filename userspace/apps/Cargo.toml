[package]
name = "osyx-apps"
description = "OSyx user programs: init (system checks), worker (child process modes) and probe (program loader checks)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "init"
path = "src/bin/init.rs"
test = false
bench = false

[[bin]]
name = "worker"
path = "src/bin/worker.rs"
test = false
bench = false

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
test = false
bench = false

[dependencies]
os-std = { path = "../../runtime/os-std" }
os-sys = { path = "../../runtime/os-sys" }
osyx-abi = { path = "../../shared/abi" }
osyx-battery = { path = "../battery" }

[[bin]]
name = "batteryd"
path = "src/bin/batteryd.rs"
test = false
bench = false

[[bin]]
name = "zen"
path = "src/bin/zen.rs"
test = false
bench = false

[[bin]]
name = "open"
path = "src/bin/open.rs"
test = false
bench = false

[[bin]]
name = "run-app"
path = "src/bin/run-app.rs"
test = false
bench = false
